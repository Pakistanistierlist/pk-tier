
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK Tier | Minecraft Rankings</title>

<style>
:root {
  --bg: #090d16;
  --panel: #111827;
  --border: #273249;
  --text: #f4f6ff;
  --muted: #98a6c2;
  --blue: #6485ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 6%;
  background: #0d1321;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span { color: var(--blue); }

header p {
  margin-bottom: 0;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 16px;
}

.hero, .panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 22px;
}

.hero {
  background: linear-gradient(125deg, #172444, #101522);
}

h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 10px; }
h2 { font-size: 21px; }
p { line-height: 1.5; }

.muted, .small { color: var(--muted); }

input, select, button {
  width: 100%;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #34415d;
  background: #0b1120;
  color: white;
  font-size: 14px;
}

input, select { margin: 7px 0 14px; }

button {
  background: var(--blue);
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

button:hover { filter: brightness(1.12); }

.modes {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 18px 0;
}

.mode-btn {
  width: auto;
  padding: 11px 15px;
  background: #151e30;
  border: 1px solid var(--border);
}

.mode-btn.active {
  background: var(--blue);
  border-color: var(--blue);
}

.tier {
  display: grid;
  grid-template-columns: 78px 1fr;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  min-height: 65px;
}

.rank {
  display: grid;
  place-items: center;
  color: #080d16;
  font-size: 17px;
  font-weight: 900;
}

.players {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px;
}

.player {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #202b40;
  border: 1px solid #35435e;
  border-radius: 8px;
  padding: 7px 10px;
}

.player img {
  width: 28px;
  height: 28px;
  image-rendering: pixelated;
}

.admin { margin-top: 30px; }

@media (max-width: 500px) {
  header { padding: 20px; }
  .logo { font-size: 25px; }
  .hero, .panel { padding: 17px; }
  .tier { grid-template-columns: 60px 1fr; }
  .mode-btn { padding: 10px; font-size: 12px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">PK <span>TIER</span></div>
  <p>PAKISTAN MINECRAFT PVP RANKINGS</p>
</header>

<main>
  <section class="hero">
    <h1>Minecraft PvP Rankings</h1>
    <p class="muted">
      Pakistan's Minecraft PvP community.
      Discover players and their tiers.
    </p>
    <input id="search" placeholder="Search player username...">
  </section>

  <section class="panel">
    <h2>🏆 Player Rankings</h2>
    <p class="muted small">Choose a gamemode to view its rankings.</p>
    <div id="modes" class="modes"></div>
    <div id="rankings"></div>
  </section>

  <section class="panel admin">
    <h2>Admin — Add or Update Player</h2>
    <p class="muted small">
      This demo saves changes in this browser only.
    </p>

    <label for="name">Minecraft Username</label>
    <input id="name" placeholder="Enter player username">

    <label for="gamemode">Gamemode</label>
    <select id="gamemode"></select>

    <label for="tierSelect">Player Tier</label>
    <select id="tierSelect"></select>

    <button id="addButton">Add / Update Player</button>
    <p id="message" class="small"></p>
  </section>
</main>

<script>
const gamemodes = [
  "CPvP",
  "Sword",
  "NethPot",
  "Spear",
  "Mace",
  "UHC",
  "Lifesteal",
  "TNT Minecart"
];

const tiers = [
  "HT1", "LT1",
  "HT2", "LT2",
  "HT3", "LT3",
  "HT4", "LT4",
  "HT5", "LT5"
];

const colors = [
  "#ff6262", "#ff9855",
  "#ffdb63", "#b5eb65",
  "#61db9b", "#5ce1dc",
  "#69a8ff", "#8d91ff",
  "#c18aff", "#ed8bd0"
];

let activeMode = "CPvP";
let players = [];

try {
  const saved = JSON.parse(
    localStorage.getItem("pktierplayers") || "[]"
  );

  if (Array.isArray(saved)) {
    players = saved
      .filter(p => p && typeof p.name === "string")
      .map(p => ({
        name: p.name,
        tiers: p.tiers ||
          (p.tier ? { Sword: p.tier } : {})
      }));
  }
} catch (e) {
  players = [];
}

const $ = id => document.getElementById(id);

function savePlayers() {
  localStorage.setItem(
    "pktierplayers",
    JSON.stringify(players)
  );
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function setupSelects() {
  $("gamemode").innerHTML = gamemodes.map(mode =>
    `<option value="${escapeHTML(mode)}">${escapeHTML(mode)}</option>`
  ).join("");

  $("tierSelect").innerHTML = tiers.map(tier =>
    `<option value="${tier}">${tier}</option>`
  ).join("");
}

function renderModes() {
  $("modes").innerHTML = gamemodes.map(mode => `
    <button
      class="mode-btn ${mode === activeMode ? "active" : ""}"
      data-mode="${escapeHTML(mode)}">
      ${escapeHTML(mode)}
    </button>
  `).join("");

  $("modes").querySelectorAll("button").forEach(button => {
    button.addEventListener("click", () => {
      activeMode = button.dataset.mode;
      render();
    });
  });
}


function renderRankings() {
  const query = $("search").value.trim().toLowerCase();

  $("rankings").innerHTML = `
    <h2>${escapeHTML(activeMode)} Rankings</h2>
    ${tiers.map((tier, index) => {
      const list = players.filter(player =>
        player.name.toLowerCase().includes(query) &&
        player.tiers[activeMode] === tier
      );

      return `
        <div class="tier">
          <div class="rank" style="background:${colors[index]}">
            ${tier}
          </div>
          <div class="players">
            ${list.length ? list.map(player => `
              <div class="player">
                <img
                  src="https://skinrender.dev/render/${encodeURIComponent(player.name)}/body?size=128"
                  alt=""
                  loading="lazy">
                <span>${escapeHTML(player.name)}</span>
                <button
                  class="remove-player"
                  data-name="${escapeHTML(player.name)}"
                  style="width:30px;padding:6px;background:#d9364f">
                  ×
                </button>
              </div>
            `).join("") : `
              <span class="small">No players ranked yet</span>
            `}
          </div>
        </div>
      `;
    }).join("")}
  `;

  $("rankings").querySelectorAll(".remove-player").forEach(button => {
    button.addEventListener("click", () => {
      const name = button.dataset.name;
      const player = players.find(p =>
        p.name.toLowerCase() === name.toLowerCase()
      );

      if (!player || !player.tiers[activeMode]) return;

      if (!confirm("Remove " + name + " from " + activeMode + "?")) return;

      delete player.tiers[activeMode];

      players = players.filter(p =>
        Object.keys(p.tiers).length > 0
      );

      savePlayers();
      render();
    });
  });
}

  renderModes();
  renderRankings();
}

function addPlayer() {
  const name = $("name").value.trim();
  const mode = $("gamemode").value;
  const tier = $("tierSelect").value;

  if (!name) {
    $("message").textContent = "Enter a Minecraft username first.";
    return;
  }

  let player = players.find(p =>
    p.name.toLowerCase() === name.toLowerCase()
  );

  if (!player) {
    player = { name, tiers: {} };
    players.push(player);
  }

  if (!player.tiers) player.tiers = {};

  player.tiers[mode] = tier;
  activeMode = mode;

  savePlayers();

  $("name").value = "";
  $("message").textContent =
    name + " ranked in " + mode + " as " + tier + ".";

  render();
}

$("search").addEventListener("input", renderRankings);
$("addButton").addEventListener("click", addPlayer);

setupSelects();
render();
</script>

</body>
</html>
